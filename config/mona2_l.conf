#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#ZW3021 fingerprint module (replaces the left encoder) -------------------
CONFIG_ZW3021=y
CONFIG_ZW3021_ENROLL_BEHAVIOR=y
CONFIG_ZW3021_DELETE_BEHAVIOR=y
CONFIG_ZW3021_CLEAR_BEHAVIOR=y
CONFIG_ZW3021_STORAGE=y
CONFIG_ZW3021_SERIAL_RPC=y
CONFIG_ZW3021_BLE_RPC=y
CONFIG_BT_MAX_CONN=2               # existing split link + browser's Bluetooth connection
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2    # existing split advertising + our own RPC advertising set
CONFIG_BT_USER_DATA_LEN_UPDATE=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y