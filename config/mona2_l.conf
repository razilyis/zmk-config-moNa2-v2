#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#ZW3021 fingerprint module (replaces the left encoder) -------------------
CONFIG_ZW3021=y
CONFIG_ZW3021_ENROLL_BEHAVIOR=y
CONFIG_ZW3021_DELETE_BEHAVIOR=y
CONFIG_ZW3021_CLEAR_BEHAVIOR=y
CONFIG_ZW3021_STORAGE=y
CONFIG_ZW3021_SERIAL_RPC=y
CONFIG_ZW3021_BLE_RPC=y
# existing split link + browser's Bluetooth connection
CONFIG_BT_MAX_CONN=2
# existing split advertising + our own RPC advertising set
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
# Left has no ZMK_SPLIT_ROLE_CENTRAL override for this (that only applies to
# Right), so it defaults to Zephyr's stock BT_MAX_PAIRED=1 -- already used up
# by the bond with Right, leaving no room to bond with a browser. Without
# this, the browser's pairing succeeds but the encrypted CCC write our
# notify characteristic requires (see ble_rpc.c) fails with a generic
# "GATT operation failed" (confirmed on real hardware).
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# The default TX buffer pool (a handful of buffers) is too small for a
# notify-heavy BLE RPC console: confirmed on real hardware, periodic
# get_status polling exhausted it ("bt_att: Ran out of TX buffers or
# contexts"), and handling that appears to have starved the ZW3021 UART
# handshake's timing, breaking enrollment while a browser stayed connected.
# ZMK Studio's own BLE RPC transport hits the same problem and bumps this
# same Kconfig option to the same value for the same reason.
CONFIG_BT_CONN_TX_MAX=64

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y